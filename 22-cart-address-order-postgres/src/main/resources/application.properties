spring.application.name=sb-ecom

# PostgreSQL. Credentials come from environment variables (no password in the repo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# To run without PostgreSQL, comment out the lines above and use H2 instead:
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:test

project.image=images/

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# JWT settings. The secret is read from the JWT_SECRET environment variable.
# The fallback value is only for running this learning project locally.
spring.app.jwtSecret=${JWT_SECRET:mySecretKey123912738aopsgjnspkmndfsopkvajoirjg94gf2opfng2moknm}
spring.app.jwtExpirationMs=3000000
spring.ecom.app.jwtCookieName=springBootEcom

